name = "mbg-monitor-cron"
main = "src/index.js"
compatibility_date = "2025-01-01"
account_id = "d0ab4a941004d8666f9dce08c4553abf"

# D1 binding — same database as Pages
[[d1_databases]]
binding       = "DB"
database_name = "mbg_db"
database_id   = "b7bedb49-d8df-4cb8-85e9-b52ce03478ba"

# KV binding — same namespace as Pages
[[kv_namespaces]]
binding = "mbg_kv"
id      = "c41e9797e4634a03bb192a32cd712f21"

# Workers AI — for article classification
[ai]
binding = "AI"

# Cron Trigger — every 2 hours
[triggers]
crons = ["0 */2 * * *"]

# Uncomment if on Workers Paid plan to extend execution time:
# [limits]
# cpu_ms = 30000
# wall_time = 600  # 10 minutes

# Secrets — set via CLI:
#   wrangler secret put AI_API_KEY --config worker/wrangler.toml
#   wrangler secret put CRON_SECRET --config worker/wrangler.toml
#
# Optional — for JS-rendered sources (Kompas, Detik, Tempo, etc.):
#   wrangler secret put LIGHTPANDA_TOKEN --config worker/wrangler.toml
#     OR
#   wrangler secret put BROWSER_WS_URL --config worker/wrangler.toml
#     (e.g. wss://euwest.cloud.lightpanda.io/ws?token=YOUR_TOKEN)
