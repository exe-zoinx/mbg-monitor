# =============================================================================
# MBG Monitor - Docker Compose Configuration
# =============================================================================
# Services for development and production environments
#
# Usage:
#   Development:       docker-compose up -d dev
#   Production build:  docker-compose build nginx
#   Production serve:  docker-compose up -d nginx
# =============================================================================

services:
  # -------------------------------------------------------------------------
  # Development Environment
  # -------------------------------------------------------------------------

  dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    ports:
      - "3000:5173"      # Frontend (static server - index.html)
      - "8787:8787"    # Worker (Wrangler)
      - "8788:8788"    # Worker API
    volumes:
      - ./frontend:/app/frontend
      - ./worker:/app/worker
      - ./vite.config.js:/app/vite.config.js
      - ./worker/wrangler.toml:/app/worker/wrangler.toml
      - ./data:/app/data
      - ./index.html:/app/index.html
      - ./static-server.js:/app/static-server.js
    environment:
      - NODE_ENV=development
    command: >
      sh -c "
        node /app/static-server.js &
        npx wrangler dev --config /app/worker/wrangler.toml --ip 0.0.0.0 &
        wait
      "

  # -------------------------------------------------------------------------
  # Worker Development (standalone)
  # -------------------------------------------------------------------------

  worker-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker-dev
    ports:
      - "8787:8787"
      - "8788:8788"
    volumes:
      - ./worker:/app/worker
      - ./worker/wrangler.toml:/app/worker/wrangler.toml
    # Note: Worker requires Cloudflare bindings (D1, KV, AI)
    # For local development, use `npm run worker:dev` with `wrangler dev`

  # -------------------------------------------------------------------------
  # Production: Build Frontend
  # -------------------------------------------------------------------------

  frontend-build:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend-build
    image: mbg-monitor:frontend-build
    volumes:
      - frontend-dist:/app/dist

  # -------------------------------------------------------------------------
  # Production: Serve Frontend with Nginx
  # -------------------------------------------------------------------------

  nginx:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    ports:
      - "8080:80"
    volumes:
      - frontend-dist:/usr/share/nginx/html:ro
    depends_on:
      frontend-build:
        condition: service_started

# Named volume for frontend build artifacts
volumes:
  frontend-dist: