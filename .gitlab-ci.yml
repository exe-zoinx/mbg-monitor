# GitLab CI/CD for MBG Monitor

# Pipeline stages
stages:
  - install
  - build
  - deploy

# Cache npm dependencies between runs
cache:
  key:
    files:
      - package-lock.json
  paths:
    - node_modules/

variables:
  NODE_VERSION: "20"

# ---------- Stage 1: install ----------

install:
  stage: install
  image: node:${NODE_VERSION}
  script:
    - npm ci
  artifacts:
    expire_in: 1 hour
    paths:
      - node_modules/

# ---------- Stage 2: build ----------

build:
  stage: build
  image: node:${NODE_VERSION}
  needs:
    - install
  script:
    - npm run build
  artifacts:
    expire_in: 1 week
    paths:
      - dist/
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'

# Validate the scraper output shape (guards against malformed data)
validate-data:
  stage: build
  image: python:3.12
  needs: []
  script:
    - python3 -c "
      import json
      with open('data/wiki_incidents.json') as f:
          d = json.load(f)
      assert isinstance(d['incidents'], list) and len(d['incidents']) > 0, 'no incidents'
      req = {'cat','date','title','loc','victims','deaths','source','source_url'}
      for inc in d['incidents']:
          missing = req - set(inc.keys())
          assert not missing, f'incident missing fields: {missing}'
      print(f'OK: {len(d[\"incidents\"])} incidents validated')
      "
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# ---------- Stage 3: deploy (manual) ----------

# Deploy to Cloudflare Pages.
# Requires CI/CD variables: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
deploy:
  stage: deploy
  image: node:${NODE_VERSION}
  needs:
    - build
  script:
    - npm ci
    - npm run deploy
  environment:
    name: production
    url: https://mbg-monitor.pages.dev
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: false
