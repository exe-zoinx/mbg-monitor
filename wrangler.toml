name                    = "mbg-monitor"
pages_build_output_dir  = "frontend/dist"
compatibility_date      = "2025-01-01"

# D1 binding for Pages Functions (/api/data, /api/history)
[[d1_databases]]
binding       = "DB"
database_name = "mbg_db"
database_id   = "b7bedb49-d8df-4cb8-85e9-b52ce03478ba"

# KV binding for Pages Functions
[[kv_namespaces]]
binding = "mbg_kv"
id      = "c41e9797e4634a03bb192a32cd712f21"

# Secrets — set via CLI:
#   wrangler pages secret put REFRESH_SECRET
#   wrangler pages secret put AI_API_KEY
#   wrangler pages secret put KILO_API_KEY
#   wrangler pages secret put KILO_MODEL
