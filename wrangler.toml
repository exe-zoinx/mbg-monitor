name            = "mbg-monitor"
pages_build_output_dir = "."
compatibility_date     = "2025-01-01"

# D1 binding for Pages Functions (/api/data, /api/history)
[[d1_databases]]
binding       = "DB"
database_name = "mbg_db"
database_id   = "b7bedb49-d8df-4cb8-85e9-b52ce03478ba"   # same DB as worker

# KV binding for Pages Functions
[[kv_namespaces]]
binding = "mbg_kv"
id      = "c41e9797e4634a03bb192a32cd712f21"         # same namespace as worker

# Secrets — set via CLI:
#   cd pages
#   wrangler pages secret put REFRESH_SECRET
#   (same value as CRON_SECRET in worker)
